<!--
  PLANE SPOTTING GALLERY

  Deploy to GitHub Pages:
    1. Save this file as `index.html` in a public repo
    2. Put your photos in a `photos/` folder beside it
    3. Edit the `photos` array below to match your filenames
    4. Repo Settings -> Pages -> Deploy from branch -> main
    5. In Google Sites: Insert -> Embed -> By URL -> https://USER.github.io/REPO/

  Photo paths are relative (`photos/whatever.jpg`) — they resolve against
  wherever this index.html is served from, so no hardcoded usernames.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  .ps-app, .ps-app * { box-sizing: border-box; margin: 0; padding: 0; }

  .ps-app {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #0f172a;
    background: linear-gradient(160deg, #e8f0fe 0%, #f0f4ff 40%, #faf5ff 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero banner ── */
  .ps-hero {
    background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 45%, #4f46e5 100%);
    padding: 36px 32px 32px;
    position: relative;
    overflow: hidden;
  }
  .ps-hero-plane {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 70%;
    background: url('photos/banner-ita.jpg') right center / contain no-repeat;
    opacity: 0.75;
    mask-image: linear-gradient(to left, black 55%, transparent 95%);
    -webkit-mask-image: linear-gradient(to left, black 55%, transparent 95%);
    pointer-events: none;
  }
  .ps-hero-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .ps-title {
    font-size: 30px; font-weight: 700; letter-spacing: -0.03em;
    color: #fff; line-height: 1.15;
  }
  .ps-subtitle { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 5px; font-weight: 400; letter-spacing: 0.01em; }
  .ps-count-badge {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px;
    white-space: nowrap;
  }

  /* ── Filter panel ── */
  .ps-filter-panel {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(148,163,184,0.2);
    padding: 18px 32px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(30,58,138,0.06);
  }
  .ps-filter-grid {
    max-width: 1200px; margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 32px;
  }
  .ps-filter-row { display: flex; align-items: flex-start; gap: 10px; }
  .ps-filter-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: #64748b; padding-top: 7px; min-width: 60px; flex-shrink: 0;
  }
  .ps-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .ps-chip {
    padding: 5px 11px;
    border: 1.5px solid #e2e8f0;
    background: #fff;
    border-radius: 999px;
    font-size: 11.5px; font-weight: 500; cursor: pointer;
    color: #475569;
    transition: all 0.14s ease;
    font-family: inherit;
    line-height: 1.4;
  }
  .ps-chip:hover { border-color: #6366f1; color: #4f46e5; background: #eef2ff; }
  .ps-chip.active {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: #fff; border-color: transparent;
    box-shadow: 0 2px 8px rgba(99,102,241,0.35);
  }

  /* ── Main content ── */
  .ps-main { max-width: 1200px; margin: 0 auto; padding: 28px 32px 48px; }

  /* ── Grid ── */
  .ps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 18px;
  }
  .ps-card {
    position: relative; overflow: hidden; border-radius: 12px;
    aspect-ratio: 4/3; cursor: pointer;
    background: #dde4f0;
    box-shadow: 0 1px 4px rgba(15,23,42,0.08), 0 4px 16px rgba(15,23,42,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .ps-card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 8px 30px rgba(15,23,42,0.15), 0 2px 8px rgba(15,23,42,0.08);
  }
  .ps-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
  .ps-card:hover img { transform: scale(1.04); }
  .ps-card-meta {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 40px 14px 12px;
    background: linear-gradient(to top, rgba(5,10,30,0.88) 0%, rgba(5,10,30,0.3) 60%, transparent 100%);
    color: #fff;
  }
  .ps-card-airline { font-size: 13.5px; font-weight: 700; line-height: 1.2; letter-spacing: 0.01em; }
  .ps-card-aircraft { font-size: 11px; opacity: 0.82; margin-top: 3px; line-height: 1.3; }
  .ps-card-reg {
    position: absolute; top: 10px; left: 10px;
    background: rgba(255,255,255,0.95);
    color: #1e3a8a;
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.04em;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .ps-card-airport {
    position: absolute; top: 10px; right: 10px;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: #fff;
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 5px;
    letter-spacing: 0.06em;
    box-shadow: 0 1px 4px rgba(99,102,241,0.4);
  }

  .ps-empty {
    grid-column: 1/-1; text-align: center; padding: 80px 24px;
    color: #94a3b8; font-size: 15px;
  }
  .ps-empty-icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.5; }

  /* ── Lightbox ── */
  .ps-lightbox {
    position: fixed; inset: 0;
    background: rgba(2,6,23,0.95);
    display: none; align-items: center; justify-content: center;
    z-index: 9999; padding: 24px;
    backdrop-filter: blur(4px);
  }
  .ps-lightbox.open { display: flex; }
  .ps-lightbox-inner { max-width: 92vw; max-height: 92vh; position: relative; }
  .ps-lightbox img {
    max-width: 92vw; max-height: 76vh; object-fit: contain;
    display: block; margin: 0 auto; border-radius: 8px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .ps-lightbox-info { color: #fff; padding-top: 16px; text-align: center; }
  .ps-lightbox-info-1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .ps-lightbox-info-2 {
    font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 5px;
    font-family: ui-monospace, monospace; letter-spacing: 0.04em;
  }
  .ps-lightbox-close {
    position: absolute; top: -44px; right: 0;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 18px; cursor: pointer;
    padding: 6px 12px; line-height: 1; border-radius: 8px;
    transition: background 0.12s;
  }
  .ps-lightbox-close:hover { background: rgba(255,255,255,0.2); }

  @media (max-width: 768px) {
    .ps-hero { padding: 24px 20px 20px; }
    .ps-title { font-size: 22px; }
    .ps-filter-panel { padding: 14px 20px; position: static; }
    .ps-filter-grid { grid-template-columns: 1fr; gap: 10px; }
    .ps-main { padding: 20px 16px 40px; }
    .ps-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .ps-hero::before { display: none; }
  }
</style>

<div class="ps-app">

  <header class="ps-hero">
    <div class="ps-hero-plane"></div>
    <div class="ps-hero-inner">
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px;">Skanda Kashyap</div>
        <h1 class="ps-title">Skanda's Plane Spotting Hub</h1>
        <div class="ps-subtitle">Aviation Photography from Airports Around the World</div>
        <span class="ps-count-badge" id="ps-count" style="display:inline-block;margin-top:10px;"></span>
      </div>
    </div>
  </header>

  <div class="ps-filter-panel">
    <div class="ps-filter-grid">
      <div class="ps-filter-row">
        <span class="ps-filter-label">Airline</span>
        <div class="ps-chips" id="ps-airline-chips"></div>
      </div>
      <div class="ps-filter-row">
        <span class="ps-filter-label">Aircraft</span>
        <div class="ps-chips" id="ps-aircraft-chips"></div>
      </div>
      <div class="ps-filter-row">
        <span class="ps-filter-label">Airport</span>
        <div class="ps-chips" id="ps-airport-chips"></div>
      </div>
      <div class="ps-filter-row">
        <span class="ps-filter-label">Date</span>
        <div class="ps-chips" id="ps-date-chips"></div>
      </div>
    </div>
  </div>

  <div class="ps-main">
    <div class="ps-grid" id="ps-grid"></div>
  </div>

  <footer style="text-align:center;padding:20px 32px 32px;font-size:12px;color:#94a3b8;letter-spacing:0.02em;">
    &copy; <span id="ps-year"></span> Skanda Kashyap. All photographs are the property of Skanda Kashyap and may not be reproduced, copied, or distributed without express written consent.
  </footer>

  <div class="ps-lightbox" id="ps-lightbox">
    <div class="ps-lightbox-inner">
      <button class="ps-lightbox-close" id="ps-close" aria-label="Close">&times;</button>
      <img id="ps-lightbox-img" src="" alt="">
      <div class="ps-lightbox-info">
        <div class="ps-lightbox-info-1" id="ps-lb-1"></div>
        <div class="ps-lightbox-info-2" id="ps-lb-2"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // ============================================================
  // EDIT THIS: your photos go here.
  // - url:      direct image URL (Cloudinary, GitHub, S3, Drive, etc.)
  // - airline:  string, used for the airline filter (be consistent)
  // - aircraft: string, used for the aircraft filter (be consistent)
  // - reg:      registration tag shown on the card
  // - location: airport code or place
  // - date:     YYYY-MM-DD
  // ============================================================
  const photos = [
    { url: "photos/N12345-2024-09-12.jpg", airline: "United",          aircraft: "Boeing 737-800",    reg: "N12345",  location: "LAX", date: "2024-09-12" },
    { url: "photos/N2749U-2024-10-03.jpg", airline: "United",          aircraft: "Boeing 777-300ER",  reg: "N2749U",  location: "SFO", date: "2024-10-03" },
    { url: "photos/N401DX-2024-08-21.jpg", airline: "Delta",           aircraft: "Airbus A320neo",    reg: "N401DX",  location: "ATL", date: "2024-08-21" },
    { url: "photos/N6701-2024-07-15.jpg",  airline: "Delta",           aircraft: "Boeing 757-200",    reg: "N6701",   location: "JFK", date: "2024-07-15" },
    { url: "photos/N832AA-2024-11-02.jpg", airline: "American",        aircraft: "E175",              reg: "N209CL",  location: "DFW", date: "2026-05-27" },
    { url: "photos/american3.jpg",         airline: "American",        aircraft: "CRJ700",            reg: "N5437",   location: "DFW", date: "2026-05-27" },
    { url: "photos/american2.jpg",         airline: "American",        aircraft: "Airbus A321",       reg: "N162AA",  location: "DFW", date: "2026-05-27" },
    { url: "photos/american1.jpg",         airline: "American",        aircraft: "Airbus A321",       reg: "N167AN",  location: "DFW", date: "2026-05-27" },
    { url: "photos/D-AIXA-2024-05-14.jpg", airline: "Lufthansa",       aircraft: "Airbus A350-900",   reg: "D-AIXA",  location: "FRA", date: "2024-05-14" },
    { url: "photos/D-ABYC-2024-09-30.jpg", airline: "Lufthansa",       aircraft: "Boeing 747-8",      reg: "D-ABYC",  location: "FRA", date: "2024-09-30" },
    { url: "photos/A6-EUA-2024-04-09.jpg", airline: "Emirates",        aircraft: "Airbus A380-800",   reg: "A6-EUA",  location: "DXB", date: "2024-04-09" },
    { url: "photos/9V-SCA-2024-03-22.jpg", airline: "Singapore",       aircraft: "Boeing 787-10",     reg: "9V-SCA",  location: "SIN", date: "2024-03-22" },
    { url: "photos/G-XLEA-2024-10-19.jpg", airline: "British Airways", aircraft: "Airbus A380-800",   reg: "G-XLEA",  location: "LHR", date: "2024-10-19" },
    { url: "photos/JA784A-2024-08-05.jpg", airline: "ANA",             aircraft: "Boeing 777-300ER",  reg: "JA784A",  location: "HND", date: "2024-08-05" }
  ];
  // ============================================================

  let fAirline  = "All";
  let fAircraft = "All";
  let fAirport  = "All";
  let fDate     = "All";

  const $ = id => document.getElementById(id);
  const uniq = key => ["All", ...Array.from(new Set(photos.map(p => p[key]))).sort()];

  function renderChips(target, key, current, onPick) {
    const el = $(target);
    el.innerHTML = "";
    uniq(key).forEach(val => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ps-chip" + (val === current ? " active" : "");
      b.textContent = val;
      b.addEventListener("click", () => { onPick(val); renderAll(); });
      el.appendChild(b);
    });
  }

  function renderGrid() {
    const f = photos.filter(p =>
      (fAirline  === "All" || p.airline  === fAirline)  &&
      (fAircraft === "All" || p.aircraft === fAircraft) &&
      (fAirport  === "All" || p.location === fAirport)  &&
      (fDate     === "All" || p.date     === fDate)
    );
    $("ps-count").textContent = f.length + " photo" + (f.length === 1 ? "" : "s");
    const grid = $("ps-grid");
    if (f.length === 0) {
      grid.innerHTML = '<div class="ps-empty"><span class="ps-empty-icon">🔍</span>No photos match these filters.</div>';
      return;
    }
    grid.innerHTML = f.map(p => {
      const idx = photos.indexOf(p);
      return `
        <div class="ps-card" data-idx="${idx}">
          <img src="${p.url}" alt="${p.airline} ${p.aircraft} ${p.reg}" loading="lazy" onerror="this.style.display='none'">
          <div class="ps-card-reg">${p.reg}</div>
          <div class="ps-card-airport">${p.location}</div>
          <div class="ps-card-meta">
            <div class="ps-card-airline">${p.airline}</div>
            <div class="ps-card-aircraft">${p.aircraft} &middot; ${p.date}</div>
          </div>
        </div>`;
    }).join("");
    grid.querySelectorAll(".ps-card").forEach(card => {
      card.addEventListener("click", () => openLightbox(parseInt(card.dataset.idx, 10)));
    });
  }

  function renderAll() {
    renderChips("ps-airline-chips",  "airline",  fAirline,  v => fAirline  = v);
    renderChips("ps-aircraft-chips", "aircraft", fAircraft, v => fAircraft = v);
    renderChips("ps-airport-chips",  "location", fAirport,  v => fAirport  = v);
    renderChips("ps-date-chips",     "date",     fDate,     v => fDate     = v);
    renderGrid();
  }

  function openLightbox(idx) {
    const p = photos[idx];
    $("ps-lightbox-img").src = p.url;
    $("ps-lightbox-img").alt = p.airline + " " + p.aircraft;
    $("ps-lb-1").textContent = p.airline + " · " + p.aircraft;
    $("ps-lb-2").textContent = p.reg + " · " + p.location + " · " + p.date;
    $("ps-lightbox").classList.add("open");
  }
  function closeLightbox() { $("ps-lightbox").classList.remove("open"); }

  $("ps-close").addEventListener("click", closeLightbox);
  $("ps-lightbox").addEventListener("click", e => {
    if (e.target.id === "ps-lightbox") closeLightbox();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

  document.getElementById("ps-year").textContent = new Date().getFullYear();
  renderAll();
})();
</script>
